# Builds the site from the committed content (site/content) and publishes it on GitHub Pages.
# The sources are not in git; run `make content` locally and commit site/content after changes.
name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: bash   # -o pipefail: a failing hugo is not hidden by the log filter

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.170.0
  PAGEFIND_VERSION: 1.6.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only two static binaries are needed (content and PDFs are committed), so no container image:
      # pinned releases, cached between runs.
      - name: Cache Hugo and Pagefind
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/bin
          key: tools-hugo${{ env.HUGO_VERSION }}-pagefind${{ env.PAGEFIND_VERSION }}

      - name: Install Hugo and Pagefind
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" | tar xz -C "$HOME/bin" hugo
          curl -sSL "https://github.com/Pagefind/pagefind/releases/download/v${PAGEFIND_VERSION}/pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz -C "$HOME/bin" pagefind

      - run: echo "$HOME/bin" >> "$GITHUB_PATH"

      - id: pages
        uses: actions/configure-pages@v5

      # base_url = https://jajopi.github.io/AOSK-public-archive (from the repository settings)
      - name: Build site
        run: hugo --source site --minify --baseURL "${{ steps.pages.outputs.base_url }}/" 2>&1 | python3 tools/hugo_log.py

      - name: Search index
        run: pagefind --site site/public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
