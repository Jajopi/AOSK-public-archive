# Hugo configuration of the AO problem archive.
# Published at https://jajopi.github.io/AOSK-public-archive/ – the GitHub Actions workflow passes that as
# --baseURL; this value is used only locally.
baseURL = "http://localhost:1313/"
locale = "sk"
defaultContentLanguage = "sk"
title = "Archív úloh Astronomickej olympiády"
enableRobotsTXT = true
capitalizeListTitles = false   # keep tag names as written (search filters match them exactly)
disableKinds = ["rss"]

[params]
  description = "Zadania a vzorové riešenia úloh Astronomickej olympiády na Slovensku"
  website = "https://www.astronomickaolympiada.sk/"
  # order of the groups everywhere (year pages, overview table): category first, then round
  # (the order of problems inside a group comes from `weight`, tools/build.py CAT_ORDER/ROUND_ORDER)
  categories = ["ZŠ", "SŠ"]
  rounds = ["DK", "RK", "CK"]

[taxonomies]              # URLs in English (/topics/…), titles in pages/<plural>/_index.md
  year = "years"
  round = "rounds"
  category = "categories"
  type = "types"
  topic = "topics"

[markup.goldmark.renderer]
  unsafe = true          # generated content contains HTML (lists with (a) labels, figures, <details>)
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$']]
    inline = [['$', '$']]
[markup.goldmark.extensions]
  typographer = false

[module]
  [[module.mounts]]
    source = "content"     # generated by tools/build.py
    target = "content"
  [[module.mounts]]
    source = "pages"       # hand-written pages
    target = "content"

[outputs]
  home = ["html"]
  section = ["html"]
  taxonomy = ["html"]
  term = ["html"]
