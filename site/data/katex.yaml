# KaTeX macros used when rendering math (layouts/_markup/render-passthrough.html).
# Add a line here when a source uses a macro KaTeX does not know (build prints "MATHERR").
macros:
  # Sun, Earth, Moon and planets (the sources use the mathabx/wasysym symbols)
  "\\Sun": "\\odot"
  "\\Earth": "\\oplus"
  "\\Ea": "\\oplus"
  "\\Ze": "\\oplus"
  "\\Zem": "\\oplus"
  "\\Moon": "\\text{☾}"
  "\\Mo": "\\text{☾}"
  "\\leftmoon": "\\text{☾}"
  "\\Mercury": "\\text{☿}"
  "\\Me": "\\text{☿}"
  "\\Venus": "\\text{♀}"
  "\\Ve": "\\text{♀}"
  "\\Mars": "\\text{♂}"
  "\\Ma": "\\text{♂}"
  "\\Jupiter": "\\text{♃}"
  "\\Ju": "\\text{♃}"
  "\\Saturn": "\\text{♄}"
  "\\Sa": "\\text{♄}"
  "\\Uranus": "\\text{⛢}"
  "\\Ur": "\\text{⛢}"
  "\\Neptune": "\\text{♆}"
  "\\Ne": "\\text{♆}"
  "\\Pluto": "\\text{♇}"
  "\\Pl": "\\text{♇}"
  "\\Aries": "\\text{♈}"
  "\\Taurus": "\\text{♉}"
  # AO macros
  "\\ztv": "\\quad\\Rightarrow\\quad"
  "\\linfrac": "#1/#2"
  "\\messier": "\\mathrm{M}\\,#1"
  "\\konst": "\\mathrm{konst.}"
  # other packages
  "\\Bar": "\\bar"
  "\\vv": "\\vec"
  "\\textsl": "\\textit"
  "\\Aboxed": "\\boxed{#1}"
  "\\odv": "\\frac{\\mathrm{d}#1}{\\mathrm{d}#2}"
  "\\sign": "\\operatorname{sign}"
  "\\arcsec": "\\operatorname{arcsec}"
  "\\widefrac": "\\frac"
  "\\varpropto": "\\propto"
  "\\degree": "^{\\circ}"
  "\\celsius": "{}^{\\circ}\\mathrm{C}"
  "\\angstrom": "\\text{Å}"
  "\\tothe": "^{#1}"
  "\\square": "\\Box"
  "\\SIspecial": "#1"
  "\\Huge": ""
  "\\displaylimits": ""
  "\\a": "\\quad , \\quad"
  "\\and": "\\quad \\wedge \\quad"
  # units used outside \SI
  "\\au": "\\mathrm{au}"
  "\\ly": "\\mathrm{ly}"
  "\\pc": "\\mathrm{pc}"
  "\\kpc": "\\mathrm{kpc}"
  "\\Mpc": "\\mathrm{Mpc}"
  "\\mag": "\\mathrm{mag}"
